

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Ehkar Client Demos</title>
    <style>
        :root {
            --primary: #2563eb;
            --dark: #0f172a;
            --light: #f8fafc;
            --accent: #10b981;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: var(--light); color: var(--dark); line-height: 1.6; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 1rem; }
        
        .error-container { max-width: 500px; width: 100%; background: white; padding: 3rem 2rem; border-radius: 16px; box-shadow: 0 10px 25px -5px rgb(0 0 0 / 0.05); text-align: center; border-top: 5px solid var(--primary); }
        .error-code { font-size: 5rem; font-weight: 800; color: var(--primary); line-height: 1; margin-bottom: 1rem; }
        h1 { font-size: 1.5rem; margin-bottom: 0.75rem; color: var(--dark); }
        p { color: #64748b; font-size: 1rem; margin-bottom: 2rem; }
        
        .btn-home { display: inline-block; background-color: var(--dark); color: white; padding: 0.85rem 1.75rem; font-weight: bold; text-decoration: none; border-radius: 8px; font-size: 1rem; transition: background 0.2s, transform 0.2s; box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2); }
        .btn-home:hover { background-color: var(--primary); transform: translateY(-2px); }
    </style>
</head>
<body>


    <div class="error-container">
        <div class="error-code">404</div>
        <h1>Oops! Page Not Found</h1>
        <p>The page or demo you are looking for might have been moved, renamed, or doesn't exist.</p>
        <a href="/" class="btn-home">← Back to Portfolio Hub</a>
    </div>


</body>
</html>
